name: "AccuKnox Secret Scan"
description: "Run AccuKnox secret scan. Set native to true to use the local binary (SARIF uploaded as data type DS, secret scan findings)."

branding: 
  icon: "shield" 
  color: "purple"

inputs:
  accuknox_token:
    description: "CSPM token"
    required: true
  accuknox_endpoint:
    description: "CSPM Console endpoint URL"
    required: true
  accuknox_label:
    description: "Label for scan results in AccuKnox Console"
    required: true
  results:
    description: "Which result types to include: verified, unknown, unverified, filtered_unverified"
    required: false
    default: ""
  branch:
    description: "Git branch to scan. Use 'all-branches' to scan all branches"
    required: false
    default: ""
  exclude_paths:
    description: "Comma-separated list of paths to exclude from scanning"
    required: false
    default: ""
  additional_arguments:
    description: "Extra arguments to pass to the secret scanning tool"
    required: false
    default: ""
  native:
    description: "Use the local secret scanner binary. true writes SARIF and uploads as data type DS (secret scan findings)."
    required: false
    default: "false"
  scanner_version:
    description: "aspm-scanner-cli GitHub release tag"
    required: false
    default: "v0.15.1"
  soft_fail:
    description: "Do not return an error code if there are failed checks"
    required: false
    default: "false"
  base_command:
    description: "Override the base command used to run the scan (optional)"
    required: false
    default: ""
  upload_results:
    description: "Upload scan results as GitHub artifact"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Run AccuKnox Secret Scan
      shell: bash
      env:
        ACCUKNOX_TOKEN: ${{ inputs.accuknox_token }}
        ACCUKNOX_LABEL: ${{ inputs.accuknox_label }}
        ACCUKNOX_ENDPOINT: ${{ inputs.accuknox_endpoint }}
        RESULTS: ${{ inputs.results }}
        BRANCH: ${{ inputs.branch }}
        EXCLUDE_PATHS: ${{ inputs.exclude_paths }}
        ADDITIONAL_ARGUMENTS: ${{ inputs.additional_arguments }}
        NATIVE: ${{ inputs.native }}
        SCANNER_VERSION: ${{ inputs.scanner_version }}
        SOFT_FAIL: ${{ inputs.soft_fail }}
        BASE_COMMAND: ${{ inputs.base_command }}
        UPLOAD_RESULTS: ${{ inputs.upload_results }}
      run: |
        set -e

        if [ -z "$ACCUKNOX_TOKEN" ] || [ -z "$ACCUKNOX_LABEL" ] || [ -z "$ACCUKNOX_ENDPOINT" ]; then
          echo "ERROR: token, label, and endpoint must be provided!"
          exit 1
        fi

        NATIVE="${NATIVE//[$'\t\r\n ']}"
        NATIVE="$(printf '%s' "$NATIVE" | tr '[:upper:]' '[:lower:]')"
        if [ -z "$NATIVE" ]; then
          NATIVE="false"
        fi
        if [ "$NATIVE" != "true" ] && [ "$NATIVE" != "false" ]; then
          echo "ERROR: native must be 'true' or 'false' (got '$NATIVE')"
          exit 1
        fi
        if [ "$NATIVE" = "true" ]; then
          ENGINE="gitleaks"
        else
          ENGINE="trufflehog"
        fi

        SCANNER_VERSION="${SCANNER_VERSION//[$'\t\r\n ']}"
        if [ -z "$SCANNER_VERSION" ]; then
          SCANNER_VERSION="v0.15.1"
        fi

        echo "Downloading AccuKnox ASPM Scanner ${SCANNER_VERSION}..."
        curl -fL "https://github.com/accuknox/aspm-scanner-cli/releases/download/${SCANNER_VERSION}/accuknox-aspm-scanner" -o accuknox-aspm-scanner
        chmod +x accuknox-aspm-scanner

        ENGINE_ARG=""
        CONTAINER_MODE_ARG="--container-mode"
        RESULT_SRC="results.jsonl"
        RESULT_DST="results-secret.jsonl"
        BASE_CMD="git file://."
        if [ "$ENGINE" = "gitleaks" ]; then
          # Local binary, no Docker. SARIF is uploaded as data_type=DS (secret scan findings).
          echo "Installing local secret scanner binary..."
          ./accuknox-aspm-scanner tool install --type gitleaks
          ENGINE_ARG="--engine gitleaks"
          CONTAINER_MODE_ARG=""
          RESULT_SRC="results.json"
          RESULT_DST="results-secret.json"
          BASE_CMD="detect --source . --report-format sarif --report-path results.json --no-banner"
          echo "SARIF results will be uploaded as data_type=DS (secret scan findings)."
        fi

        touch "./$RESULT_SRC"
        chmod 666 "./$RESULT_SRC"

        # Soft fail argument
        SOFT_FAIL="${SOFT_FAIL//[$'\t\r\n ']}"
        SOFT_FAIL_ARG=""
        if [ "$SOFT_FAIL" = "true" ]; then
          SOFT_FAIL_ARG="--softfail"
        fi

        # Build base command
        if [ -n "$BASE_COMMAND" ]; then
          BASE_CMD="$BASE_COMMAND"
        fi

        # TruffleHog-only flags; gitleaks uses --command / additional_arguments
        ARGS=""
        if [ "$ENGINE" = "trufflehog" ]; then
          [ -n "$RESULTS" ] && ARGS="$ARGS --results $RESULTS"
          [ -n "$BRANCH" ] && ARGS="$ARGS --branch $BRANCH"
          [ -n "$EXCLUDE_PATHS" ] && ARGS="$ARGS --exclude-paths $EXCLUDE_PATHS"
        fi
        [ -n "$ADDITIONAL_ARGUMENTS" ] && ARGS="$ARGS $ADDITIONAL_ARGUMENTS"

        echo "Running AccuKnox secret scan..."
        echo "./accuknox-aspm-scanner scan --keep-results $SOFT_FAIL_ARG secret --command \"$BASE_CMD $ARGS\" $ENGINE_ARG $CONTAINER_MODE_ARG"
        ./accuknox-aspm-scanner scan --keep-results $SOFT_FAIL_ARG secret --command "$BASE_CMD $ARGS" $ENGINE_ARG $CONTAINER_MODE_ARG

        cp "$RESULT_SRC" "$RESULT_DST"

    - name: Upload secret scan artifact
      if: ${{ inputs.upload_results == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: secret-scan-results
        path: |
          results-secret.jsonl
          results-secret.json
        if-no-files-found: error
        retention-days: 30
      
